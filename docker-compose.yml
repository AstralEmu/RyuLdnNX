# Base configuration shared by all services (no entrypoint, no command)
x-service-base: &service-base
  image: ghcr.io/ethiquema/ryu_ldn_nx:latest
  build:
    context: .
    dockerfile: Dockerfile
  volumes:
    - .:/workspace
  working_dir: /workspace
  # Every service writes into the bind-mounted checkout: run as the caller so
  # nothing it creates (objects, output/, formatted sources) is owned by root.
  # `make` exports the real ids; plain `docker compose` falls back to 1000.
  user: "${DOCS_UID:-1000}:${DOCS_GID:-1000}"
  environment:
    HOME: /tmp

# Build-specific base (adds entrypoint + command)
x-build-base: &build-base
  <<: *service-base
  entrypoint: ["/bin/bash"]
  command: ["/workspace/scripts/builder/entrypoint-build.sh"]

# Clean-specific base (adds entrypoint + command)
x-clean-base: &clean-base
  <<: *service-base
  entrypoint: ["/bin/bash"]
  command: ["/workspace/scripts/builder/entrypoint-clean.sh"]

services:
  # ──────────────────────────────────────────────────────────────────────────
  # Build everything + package into output/ and ZIP (embedded atmosphere-libs)
  # Usage: docker compose run --rm build
  # Uses the pre-built libstratosphere.a from the Docker image.
  # ──────────────────────────────────────────────────────────────────────────
  build:
    <<: *build-base
    pull_policy: always

  # ──────────────────────────────────────────────────────────────────────────
  # Build with LOCAL atmosphere-libs (./sysmodule/Atmosphere-libs)
  # Usage: docker compose run --rm build-local
  # Mounts the local Atmosphere-libs checkout over /opt/ryu_ldn_nx,
  # shadowing the image's pre-built .a and exposing local source for patching.
  # ──────────────────────────────────────────────────────────────────────────
  build-local:
    <<: *build-base
    volumes:
      - .:/workspace
      - ./sysmodule/Atmosphere-libs:/opt/ryu_ldn_nx
    environment:
      - ATMOSPHERE_LIBS_PATH=/workspace/sysmodule/Atmosphere-libs
      - HOME=/tmp

  # ──────────────────────────────────────────────────────────────────────────
  # Clean all build artifacts + output (embedded atmosphere-libs)
  # Usage: docker compose run --rm clean
  # ──────────────────────────────────────────────────────────────────────────
  clean:
    <<: *clean-base

  # ──────────────────────────────────────────────────────────────────────────
  # Clean with LOCAL atmosphere-libs (./sysmodule/Atmosphere-libs)
  # Usage: docker compose run --rm clean-local
  # Extended clean: also cleans local libstratosphere build artifacts.
  # ──────────────────────────────────────────────────────────────────────────
  clean-local:
    <<: *clean-base
    volumes:
      - .:/workspace
      - ./sysmodule/Atmosphere-libs:/opt/ryu_ldn_nx
    environment:
      - ATMOSPHERE_LIBS_PATH=/workspace/sysmodule/Atmosphere-libs
      - HOME=/tmp

  # Run tests (host binary with g++)
  # NOTE: tests run on the host, not in the dev container — they use
  # g++ and don't need cross-compilation. This is kept as a fallback.
  test:
    <<: *service-base
    working_dir: /workspace/tests
    environment:
      - COVERAGE
      - HOME=/tmp
    command: make clean test

  # Doxygen XML for the wiki code reference (rendered on the host by
  # scripts/gen_docs.py, which writes into the ./docs wiki symlink that is not
  # mounted here). Runs as the host user so .cache/ is not root-owned.
  # Usage: make docs
  docs:
    <<: *service-base
    entrypoint: ["python3", "/workspace/scripts/gen_docs.py", "--xml-only"]

  # GDB debugger for Switch (interactive)
  # Usage: docker compose run --rm debugger <SWITCH_IP> [PROCESS_ID]
  debugger:
    <<: *service-base
    network_mode: host
    stdin_open: true
    tty: true
    entrypoint: ["/workspace/scripts/debugger/debug.sh"]

  # Run clang-tidy on project source files (not Atmosphere-libs)
  # Usage: docker compose run --rm lint
  # The lint image is tagged on its own: inheriting the base `image:` would
  # make `docker compose build lint` overwrite the published dev image tag.
  lint:
    <<: *service-base
    image: ryu_ldn_nx-lint:local
    build:
      context: .
      dockerfile: lint.Dockerfile
    entrypoint: ["/bin/bash", "/workspace/scripts/lint.sh"]

  # Formatting + Doxygen-completeness gate (scripts/style.py), run in the lint
  # image so the clang-format version is pinned. Extra args reach style.py:
  #   docker compose run --rm style            (check)
  #   docker compose run --rm style format     (rewrite in place)
  style:
    <<: *service-base
    image: ryu_ldn_nx-lint:local
    build:
      context: .
      dockerfile: lint.Dockerfile
    entrypoint: ["python3", "/workspace/scripts/style.py"]

  # Local CodeQL run with the same queries and paths as the GitHub workflow.
  # Usage: CODEQL_HOME=/path/to/unpacked/codeql docker compose run --rm codeql
  codeql:
    <<: *service-base
    volumes:
      - .:/workspace
      - ${CODEQL_HOME:-/var/empty}:/opt/codeql:ro
    environment:
      HOME: /tmp
      CODEQL_HOME: /opt/codeql
    entrypoint: ["/bin/bash", "/workspace/scripts/codeql.sh"]

  shell:
    <<: *service-base
    network_mode: host
    stdin_open: true
    tty: true
    entrypoint: ["/bin/bash"]